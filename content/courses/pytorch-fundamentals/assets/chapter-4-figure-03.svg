<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <title>数据增强：同一只猫的合理变体</title>

  <!-- 背景 -->
  <rect width="920" height="680" fill="#fbfaf6"/>

  <!-- 主标题 -->
  <text x="460" y="36" text-anchor="middle" font-size="18" font-weight="600" fill="#3a3a3a">数据增强：同一张图的合理变体（标签不变）</text>
  <text x="460" y="58" text-anchor="middle" font-size="12.5" fill="#888">同一只猫，经过随机翻转 / 旋转 / 颜色抖动，答案仍然是「猫」</text>

  <!-- 可复用的猫剪影（正面坐姿，尾巴在右侧） -->
  <defs>
    <g id="cat">
      <!-- 耳朵 -->
      <path d="M -30 -35 L -18 -82 L -6 -42 Z"/>
      <path d="M 30 -35 L 18 -82 L 6 -42 Z"/>
      <!-- 头 -->
      <circle cx="0" cy="-32" r="46"/>
      <!-- 眼睛高光 -->
      <circle cx="-15" cy="-36" r="3.6" fill="#ffffff" opacity="0.9"/>
      <circle cx="15" cy="-36" r="3.6" fill="#ffffff" opacity="0.9"/>
      <!-- 身体 -->
      <ellipse cx="0" cy="56" rx="48" ry="60"/>
      <!-- 前腿 -->
      <ellipse cx="-16" cy="102" rx="11" ry="16"/>
      <ellipse cx="16" cy="102" rx="11" ry="16"/>
      <!-- 尾巴（弯曲上翘） -->
      <path d="M 42 72 C 72 62, 82 36, 74 12" stroke-width="13" stroke-linecap="round" fill="none"/>
    </g>
  </defs>

  <!-- ============ 左上：原图 ============ -->
  <g>
    <rect x="60" y="80" width="400" height="240" rx="14" fill="#ffffff" stroke="#e3dfd3" stroke-width="1.2"/>
    <g transform="translate(260, 195)">
      <g fill="#8a8f98" stroke="#8a8f98">
        <use href="#cat"/>
      </g>
    </g>
    <text x="260" y="346" text-anchor="middle" font-size="14" font-weight="600" fill="#444">① 原图</text>
  </g>

  <!-- ============ 右上：水平翻转 ============ -->
  <g>
    <rect x="480" y="80" width="400" height="240" rx="14" fill="#ffffff" stroke="#e3dfd3" stroke-width="1.2"/>
    <g transform="translate(680, 195) scale(-1, 1)">
      <g fill="#8a8f98" stroke="#8a8f98">
        <use href="#cat"/>
      </g>
    </g>
    <text x="680" y="346" text-anchor="middle" font-size="14" font-weight="600" fill="#444">② 水平翻转</text>
  </g>

  <!-- ============ 左下：随机旋转 ============ -->
  <g>
    <rect x="60" y="370" width="400" height="240" rx="14" fill="#ffffff" stroke="#e3dfd3" stroke-width="1.2"/>
    <g transform="translate(260, 485) rotate(-14)">
      <g fill="#8a8f98" stroke="#8a8f98">
        <use href="#cat"/>
      </g>
    </g>
    <text x="260" y="636" text-anchor="middle" font-size="14" font-weight="600" fill="#444">③ 随机旋转（约 -14°）</text>
  </g>

  <!-- ============ 右下：颜色抖动（偏暖/变暗） ============ -->
  <g>
    <!-- 格子底色整体偏暖 -->
    <rect x="480" y="370" width="400" height="240" rx="14" fill="#f7ece0" stroke="#e3cdb4" stroke-width="1.2"/>
    <g transform="translate(680, 485)">
      <!-- 猫整体换成偏暖、稍暗的棕褐色 -->
      <g fill="#b08a5a" stroke="#b08a5a">
        <use href="#cat"/>
      </g>
    </g>
    <!-- 整格暖色半透明叠层，模拟整图色温偏移/变暗 -->
    <rect x="480" y="370" width="400" height="240" rx="14" fill="#d98a3a" opacity="0.16"/>
    <text x="680" y="636" text-anchor="middle" font-size="14" font-weight="600" fill="#444">④ 颜色抖动（偏暖 / 变暗）</text>
  </g>

  <!-- 底部说明 -->
  <text x="460" y="668" text-anchor="middle" font-size="11.5" fill="#9a9a9a">示意图：变换均为合理的小扰动，标签始终是「猫」——这就是数据增强让模型更鲁棒的思想。</text>
</svg>
