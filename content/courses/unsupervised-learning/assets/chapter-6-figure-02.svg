<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <title>图像压缩：KMeans 颜色量化 K=16 对比</title>

  <rect width="960" height="490" fill="#fbfaf6"/>

  <!-- 标题 -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#3a3a3a">图像压缩：KMeans 颜色量化（K=16）前后对比</text>
  <text x="480" y="56" text-anchor="middle" font-size="12.5" fill="#888">同一张风景：左侧色彩细腻丰富；右侧仅用 16 种代表色，出现明显大色块与边缘锯齿</text>

  <!-- ============ 左图：原图 ============ -->
  <g>
    <!-- 外框 -->
    <rect x="40" y="80" width="420" height="300" fill="#ffffff" stroke="#d8d4c8" stroke-width="1.2"/>

    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#6fb7e8"/>
        <stop offset="55%"  stop-color="#a8d4ef"/>
        <stop offset="100%" stop-color="#f5e6c8"/>
      </linearGradient>
    </defs>

    <g transform="translate(40, 80)">
      <!-- 天空（平滑渐变） -->
      <rect x="0" y="0" width="420" height="185" fill="url(#skyGrad)"/>

      <!-- 太阳（带柔和光晕） -->
      <circle cx="350" cy="55" r="36" fill="#ffd84d" opacity="0.35"/>
      <circle cx="350" cy="55" r="24" fill="#ffd84d"/>

      <!-- 云（多个柔和椭圆叠加） -->
      <g fill="#ffffff">
        <ellipse cx="110" cy="72" rx="40" ry="14"/>
        <ellipse cx="140" cy="64" rx="28" ry="12"/>
        <ellipse cx="85"  cy="68" rx="22" ry="10"/>
      </g>

      <!-- 远山两层 -->
      <path d="M 0 178 L 80 140 L 160 166 L 240 134 L 320 160 L 420 150 L 420 188 L 0 188 Z" fill="#8aa88f"/>
      <path d="M 0 188 L 60 162 L 140 180 L 220 158 L 300 180 L 380 166 L 420 176 L 420 200 L 0 200 Z" fill="#5f8a68"/>

      <!-- 草地 -->
      <rect x="0" y="200" width="420" height="100" fill="#7cb35a"/>

      <!-- 树：柔和树冠 -->
      <rect x="75" y="225" width="10" height="55" fill="#8b5a2b"/>
      <circle cx="80" cy="212" r="30" fill="#4a7c3a"/>
      <circle cx="63" cy="222" r="18" fill="#5a8a45"/>
      <circle cx="97" cy="222" r="18" fill="#5a8a45"/>
    </g>

    <text x="250" y="410" text-anchor="middle" font-size="14" font-weight="600" fill="#3a3a3a">原图（24 位真彩色，约 1670 万色）</text>
  </g>

  <!-- ============ 右图：K=16 颜色量化 ============ -->
  <g>
    <rect x="500" y="80" width="420" height="300" fill="#ffffff" stroke="#d8d4c8" stroke-width="1.2"/>

    <g transform="translate(500, 80)">
      <!-- 天空：两段纯色矩形，无渐变 -->
      <rect x="0" y="0" width="420" height="95" fill="#5a9fd4"/>
      <rect x="0" y="95" width="420" height="90" fill="#9ecbe8"/>

      <!-- 太阳：纯色圆，无光晕 -->
      <circle cx="350" cy="55" r="24" fill="#f5c53a"/>

      <!-- 云：锯齿多边形，硬边 -->
      <polygon points="70,80 88,60 118,55 148,62 158,78 150,86 72,86" fill="#ffffff"/>

      <!-- 远山：纯色多边形 -->
      <polygon points="0,178 80,140 160,166 240,134 320,160 420,150 420,188 0,188" fill="#7a9480"/>
      <polygon points="0,188 60,162 140,180 220,158 300,180 380,166 420,176 420,200 0,200" fill="#547a5e"/>

      <!-- 草地：纯色 -->
      <rect x="0" y="200" width="420" height="100" fill="#6fa04e"/>

      <!-- 树：树干矩形 + 锯齿多边形树冠 -->
      <rect x="75" y="225" width="10" height="55" fill="#7a4e26"/>
      <polygon points="80,180 56,200 50,222 60,238 100,238 110,222 104,200" fill="#3f6b33"/>
    </g>

    <text x="710" y="410" text-anchor="middle" font-size="14" font-weight="600" fill="#3a3a3a">KMeans 颜色量化（K=16，仅 16 色）</text>
  </g>

  <!-- 底部说明 -->
  <text x="480" y="448" text-anchor="middle" font-size="11.5" fill="#9a9a9a">示意图：颜色量化把相近颜色聚类为 K=16 个代表色并替换，画面出现明显大色块与边缘锯齿，但像素字节数大幅下降。</text>
</svg>
