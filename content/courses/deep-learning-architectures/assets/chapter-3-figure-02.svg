<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <title>数据增强：同一张图变出多个训练样本</title>

  <rect width="960" height="620" fill="#fbfaf6"/>

  <!-- 标题 -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#3a3a3a">数据增强：同一张图变出多个训练样本</text>
  <text x="480" y="56" text-anchor="middle" font-size="12.5" fill="#888">一张原图施加多种随机变换 → 多个合理训练样本，标签始终是「猫」</text>

  <!-- 可复用猫剪影 -->
  <defs>
    <g id="cat">
      <path d="M -30 -35 L -18 -82 L -6 -42 Z"/>
      <path d="M 30 -35 L 18 -82 L 6 -42 Z"/>
      <circle cx="0" cy="-32" r="46"/>
      <circle cx="-15" cy="-36" r="3.6" fill="#ffffff" opacity="0.9"/>
      <circle cx="15" cy="-36" r="3.6" fill="#ffffff" opacity="0.9"/>
      <ellipse cx="0" cy="56" rx="48" ry="60"/>
      <ellipse cx="-16" cy="102" rx="11" ry="16"/>
      <ellipse cx="16" cy="102" rx="11" ry="16"/>
      <path d="M 42 72 C 72 62, 82 36, 74 12" stroke-width="13" stroke-linecap="round" fill="none"/>
    </g>
    <!-- 每格的裁剪区域（与格子 rect 一致） -->
    <clipPath id="g1"><rect x="30"  y="80" width="260" height="210" rx="12"/></clipPath>
    <clipPath id="g2"><rect x="350" y="80" width="260" height="210" rx="12"/></clipPath>
    <clipPath id="g3"><rect x="670" y="80" width="260" height="210" rx="12"/></clipPath>
    <clipPath id="g4"><rect x="30"  y="330" width="260" height="210" rx="12"/></clipPath>
    <clipPath id="g5"><rect x="350" y="330" width="260" height="210" rx="12"/></clipPath>
    <clipPath id="g6"><rect x="670" y="330" width="260" height="210" rx="12"/></clipPath>
  </defs>

  <!-- ===== 格1：原图（左上） ===== -->
  <g>
    <rect x="30" y="80" width="260" height="210" rx="12" fill="#ffffff" stroke="#e3dfd3" stroke-width="1.2"/>
    <g clip-path="url(#g1)">
      <g transform="translate(160, 167)">
        <g fill="#8a8f98" stroke="#8a8f98"><use href="#cat"/></g>
      </g>
    </g>
    <text x="160" y="310" text-anchor="middle" font-size="13.5" font-weight="600" fill="#444">① 原图</text>
  </g>

  <!-- ===== 格2：随机裁剪（上中）：放大后只露头肩，下半身被裁 ===== -->
  <g>
    <rect x="350" y="80" width="260" height="210" rx="12" fill="#ffffff" stroke="#e3dfd3" stroke-width="1.2"/>
    <g clip-path="url(#g2)">
      <g transform="translate(480, 200) scale(1.5)">
        <g fill="#8a8f98" stroke="#8a8f98"><use href="#cat"/></g>
      </g>
    </g>
    <text x="480" y="310" text-anchor="middle" font-size="13.5" font-weight="600" fill="#444">② 随机裁剪</text>
  </g>

  <!-- ===== 格3：水平翻转（右上） ===== -->
  <g>
    <rect x="670" y="80" width="260" height="210" rx="12" fill="#ffffff" stroke="#e3dfd3" stroke-width="1.2"/>
    <g clip-path="url(#g3)">
      <g transform="translate(800, 167) scale(-1, 1)">
        <g fill="#8a8f98" stroke="#8a8f98"><use href="#cat"/></g>
      </g>
    </g>
    <text x="800" y="310" text-anchor="middle" font-size="13.5" font-weight="600" fill="#444">③ 水平翻转</text>
  </g>

  <!-- ===== 格4：随机旋转（左下） ===== -->
  <g>
    <rect x="30" y="330" width="260" height="210" rx="12" fill="#ffffff" stroke="#e3dfd3" stroke-width="1.2"/>
    <g clip-path="url(#g4)">
      <g transform="translate(160, 417) rotate(-15)">
        <g fill="#8a8f98" stroke="#8a8f98"><use href="#cat"/></g>
      </g>
    </g>
    <text x="160" y="560" text-anchor="middle" font-size="13.5" font-weight="600" fill="#444">④ 随机旋转（约 -15°）</text>
  </g>

  <!-- ===== 格5：颜色抖动（下中） ===== -->
  <g>
    <rect x="350" y="330" width="260" height="210" rx="12" fill="#f7ece0" stroke="#e3cdb4" stroke-width="1.2"/>
    <g clip-path="url(#g5)">
      <g transform="translate(480, 417)">
        <g fill="#b08a5a" stroke="#b08a5a"><use href="#cat"/></g>
      </g>
      <rect x="350" y="330" width="260" height="210" fill="#d98a3a" opacity="0.16"/>
    </g>
    <text x="480" y="560" text-anchor="middle" font-size="13.5" font-weight="600" fill="#444">⑤ 颜色抖动（偏暖 / 变暗）</text>
  </g>

  <!-- ===== 格6：随机平移（右下）：整体偏右上 ===== -->
  <g>
    <rect x="670" y="330" width="260" height="210" rx="12" fill="#ffffff" stroke="#e3dfd3" stroke-width="1.2"/>
    <g clip-path="url(#g6)">
      <g transform="translate(825, 398)">
        <g fill="#8a8f98" stroke="#8a8f98"><use href="#cat"/></g>
      </g>
    </g>
    <text x="800" y="560" text-anchor="middle" font-size="13.5" font-weight="600" fill="#444">⑥ 随机平移</text>
  </g>

  <!-- 底部说明 -->
  <text x="480" y="598" text-anchor="middle" font-size="11.5" fill="#9a9a9a">示意图：6 张图都来自同一张原图，标签不变；这些合理小扰动能显著扩充训练集多样性。</text>
</svg>
