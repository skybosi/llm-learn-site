<!doctype html><meta charset="utf-8">
<title>llm-learn</title>
<script>
  // 站点按「项目页」部署（https://<user>.github.io/<repo>/）：把 404 路径换成站点根，保留 #/ 路由
  // 若你绑定了自定义域名（站点在根路径），把下面这行改成 location.replace('/' + location.hash)
  var seg = location.pathname.split('/').filter(Boolean);
  location.replace((seg.length ? '/' + seg[0] + '/' : '/') + location.hash);
</script>
